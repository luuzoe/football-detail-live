<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>အသေးစိတ် ဘောလုံး Live - Live Scores, Stats, Lineups</title>
<meta name="description" content="FotMob ပုံစံ အသေးစိတ် ဘောလုံးရလဒ်ဆိုက်။ Live score, ပွဲအသေးစိတ် stats, လူစာရင်း, အဆင့်ဇယား, ဂိုးသွင်း, သတင်း။">
<link rel="preconnect" href="https://site.api.espn.com">
<link rel="preconnect" href="https://a.espncdn.com">
<link rel="stylesheet" href="styles.css?v=3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
</head>
<body>
<header class="top">
  <div class="brand">⚽ <b>အသေးစိတ် ဘောလုံး</b></div>
  <div class="topnote">Live • Stats • Lineups • Standings</div>
</header>

<div class="leagues" id="leagues"></div>

<div class="toolbar">
  <div class="dates" id="dates"></div>
  <div class="searchrow">
    <input id="search" type="search" placeholder="အသင်းရှာပါ… (ဥပမာ Arsenal)" autocomplete="off">
    <button id="favBtn" class="favbtn" onclick="toggleFavOnly()">⭐ အကြိုက်ဆုံး</button>
  </div>
</div>

<main id="app"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>

<nav class="bottomnav">
  <button id="navMatches" class="navbtn active" onclick="setTab('matches')">📅<span>ပွဲစဉ်</span></button>
  <button id="navStandings" class="navbtn" onclick="setTab('standings')">📊<span>အဆင့်</span></button>
  <button id="navScorers" class="navbtn" onclick="setTab('scorers')">🎯<span>ဂိုးသွင်း</span></button>
  <button id="navNews" class="navbtn" onclick="setTab('news')">📰<span>သတင်း</span></button>
</nav>

<footer>
  <p>ဒေတာ: ESPN အများပြည်သူဆိုင်ရာ API • xG / shot map / ကစားသမား rating / ဒဏ်ရာ / transfer အပြည့်အစုံက paid API မှသာ ရနိုင်ပါတယ်။</p>
  <p class="small">KZZ ဆိုက်နဲ့ လုံးဝ သီးခြားဆိုက် ဖြစ်ပါသည်။</p>
</footer>

<script src="app.js?v=3"></script>
</body>
</html>
